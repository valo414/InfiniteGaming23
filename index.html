<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiniteGaming23 | Official Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Abstract Dark Space Theme Background */
            background: radial-gradient(circle at center, #1b0033 0%, #050010 60%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Subtle CSS stars effect for the background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.4;
            z-index: 0;
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            background: rgba(20, 20, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 3px solid rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
            display: block;
        }

        .title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(162, 82, 255, 0.6);
        }

        .subtitle {
            color: #a0a0b5;
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, rgba(43, 0, 87, 0.8) 0%, rgba(0, 132, 255, 0.8) 100%);
            color: white;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 14px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Neon Hover Effect */
        .link-btn:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, rgba(61, 0, 122, 0.9) 0%, rgba(0, 225, 255, 0.9) 100%);
            border-color: rgba(0, 243, 255, 0.8);
            box-shadow: 0 12px 30px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .link-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        
        <!-- The logo references your exact image filename -->
        <img src="infinitvgaming23_LOGO_2.jpg" alt="InfiniteGaming23 Logo" class="profile-logo" onerror="this.src='https://placehold.co/150x150/1b0033/00f3ff?text=IG23'">
        
        <h1 class="title">InfiniteGaming23</h1>
        <p class="subtitle">Official Links</p>
        
        <!-- The button linking to the GTA Mods list Google Doc -->
        <a href="https://docs.google.com/document/d/1uPbFPrXOxZ7Q40oQ7S_zAme1AgeW_LBmwnZSfMAgUmk/edit?usp=drivesdk&ouid=100136729870679364716" target="_blank" class="link-btn">
            GTA Mods List
        </a>
        
    </div>

</body>
</html>
